name: Java CI with Maven
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Run on a standard Ubuntu environment
    runs-on: ubuntu-latest

    steps:
    # 1. Download your code from the repository
    - uses: actions/checkout@v4

    # 2. Install Java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 3. Run the Maven package command
    - name: Build with Maven
      run: mvn -B clean package -DskipTests

    # 4. .Jar upload
    - name: Upload the built JAR file
      uses: actions/upload-artifact@v4
      with:
        name: Alhambra-Game-JAR
        path: target/alhambra-dice-game-1.0-SNAPSHOT.jar
